<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>照相艙登入</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>body{background:#f8fafc}</style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md mx-4">
    <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-full bg-indigo-50 flex items-center justify-center">
          <span class="text-indigo-600 text-lg font-semibold">LIFF</span>
        </div>
        <div>
          <h1 class="text-xl font-semibold text-gray-900">照相艙登入</h1>
          <p class="text-sm text-gray-500">取得使用者資訊並回傳伺服器</p>
        </div>
      </div>

      <!-- Loading -->
      <div id="state-loading" class="flex flex-col items-center justify-center py-8">
        <svg class="animate-spin h-8 w-8 text-indigo-600 mb-3" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
        </svg>
        <p class="text-gray-700 font-medium">載入中…</p>
        <p class="text-gray-500 text-sm">正在初始化帳號並送出資料</p>
      </div>

      <!-- Success -->
      <div id="state-success" class="hidden">
        <div class="flex items-center gap-2 text-emerald-600 mb-3">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
            <path d="M20 7L9 18l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="font-semibold">已成功送出並收到伺服器回應</span>
        </div>
        <div class="rounded-xl bg-emerald-50 border border-emerald-100 p-4 text-emerald-800 text-sm">
          <p class="mb-1"><span class="font-medium">使用者：</span><span id="userName"></span></p>
          <p class="mb-1"><span class="font-medium">UserID：</span><span id="userId"></span></p>
          <p class="mb-1"><span class="font-medium">mid：</span><span id="midVal">—</span></p>
          <p class="mb-1"><span class="font-medium">campaign：</span><span id="campaignVal">—</span></p>
          <p class="mt-2"><span class="font-medium">Server 回傳：</span></p>
          <pre id="serverJson" class="mt-1 text-xs whitespace-pre-wrap"></pre>
        </div>
      </div>

      <!-- Error -->
      <div id="state-error" class="hidden">
        <div class="flex items-center gap-2 text-rose-600 mb-3">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
            <path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="font-semibold">發生錯誤</span>
        </div>
        <div class="rounded-xl bg-rose-50 border border-rose-100 p-4 text-rose-800 text-sm">
          <p id="errorText" class="whitespace-pre-wrap"></p>
        </div>
      </div>

      <details class="mt-4">
        <summary class="text-sm text-gray-600 cursor-pointer">顯示除錯日誌</summary>
        <pre id="log" class="mt-2 text-xs text-gray-600 whitespace-pre-wrap"></pre>
      </details>
    </div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id)
    const log = (...a)=>{ $('log').textContent += a.join(' ') + '\n' }
    function showState(which){ for (const id of ['state-loading','state-success','state-error']) { $(id).classList.toggle('hidden', id!==which) } }

    // 支援 ?query 與 hash 中的 ?query
    function getParam(name){
      const url = new URL(location.href);
      let v = url.searchParams.get(name);
      if (v !== null) return v;
      if (url.hash && url.hash.includes('?')) {
        const sp = new URLSearchParams(url.hash.split('?')[1]);
        v = sp.get(name);
        if (v !== null) return v;
      }
      return null;
    }

    // 進頁面先快取 mid/campaign，避免跳轉後遺失
    (function cacheParams(){
      const m = getParam('mid'); const c = getParam('c');
      if (m) sessionStorage.setItem('mid', m);
      if (c) sessionStorage.setItem('campaign', c);
    })();

    (async () => {
      try {
        showState('state-loading');

        await liff.init({ liffId: '2008262199-mP71nXJR' });
        if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });

        const profile = await liff.getProfile();

        // 取得參數：URL 優先，否則用快取
        const mid = getParam('mid') ?? sessionStorage.getItem('mid') ?? null;
        const campaign = getParam('c') ?? sessionStorage.getItem('campaign') ?? null;

        log('Hello,', profile.displayName, profile.userId);
        if (mid) log('mid:', mid);
        if (campaign) log('campaign:', campaign);

        // 顯示基本資訊
        $('userName').textContent = profile.displayName || '';
        $('userId').textContent   = profile.userId || '';
        $('midVal').textContent   = mid ?? '—';
        $('campaignVal').textContent = campaign ?? '—';

        // 可選：把遺失的參數補回網址（不重整）
        // if (!getParam('mid') && mid) {
        //   const u = new URL(location.href);
        //   u.searchParams.set('mid', mid);
        //   if (campaign && !getParam('c')) u.searchParams.set('c', campaign);
        //   history.replaceState(null, '', u.toString());
        // }

        // 送到後端（依你指定）
        const api = "https://scanningpod.lightmatrix3d.com/api/methodSuccessful";
        const { data } = await axios.post(api, { UID: profile.userId, MID: mid }, { withCredentials: true, timeout: 30000 });

        log('Server:', JSON.stringify(data));
        $('serverJson').textContent = JSON.stringify(data, null, 2);
        showState('state-success');

      } catch (e) {
        console.error(e);
        const msg = e?.response?.data ? JSON.stringify(e.response.data) : (e?.message || String(e));
        $('errorText').textContent = '無法連接伺服器或請求失敗：\n' + msg;
        showState('state-error');
      }
    })();
  </script>
</body>
</html>
